spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tododb
    username: elena
    password: geheimwasanderes
  jpa:
    hibernate:
      ddl-auto: update

  # Unser 30-Tage-Komfort-Paket
  servlet:
    session:
      timeout: 7d
      cookie:
        max-age: 7d

bucket4j:
  enabled: true
  filters:
    - name: rate-limit-filter
      url: /api/.*
      rate-limits:
        - bandwidths:
            - capacity: 10       # 🎯 Reduziert auf maximal 10 Anfragen...
              time: 1
              unit: minutes      # 🎯 ...pro Minute.